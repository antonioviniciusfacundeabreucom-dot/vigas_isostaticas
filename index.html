<!DOCTYPE html>

    <head>

         <link rel="stylesheet" href="style.css">
    </head>
    
    <body>
        <header> 
           
            <h1>Cálculo de Vigas</h1>
           
            <div class ="constraste">

            <div class = "bloco">

            </div>
            

            <div class = "bloco">
                <label for = "Altura da seção transvensal">Altura da seção transvensal</label>

            </div>
            

            <div class = "bloco">
                <label for = "largura da seção transvensal">largura da seção transvensal</label>
                <input type = "Largura" name = "Largura" placeholder = "m" id = "Largura">
                </div>
